name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint v2.11.4
        run: |
          install_bin="$(go env GOPATH)/bin"
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$install_bin" v2.11.4
          echo "$install_bin" >> "$GITHUB_PATH"
      - name: make verify
        run: make verify

  gh-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check for e2e token
        id: check-token
        run: |
          if [ -n "${{ secrets.AGENCY_GH_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping GH-backed S5 happy-path e2e - AGENCY_GH_TOKEN not configured"
          fi
      - name: gh auth status
        if: steps.check-token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENCY_GH_TOKEN }}
        run: gh auth status
      - name: make e2e-s5-happy
        if: steps.check-token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENCY_GH_TOKEN }}
        run: make e2e-s5-happy
